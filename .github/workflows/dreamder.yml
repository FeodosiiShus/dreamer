name: Dreamder

on:
  push:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
  pull_request:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
  workflow_dispatch:

concurrency:
  group: dreamder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Crash guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - name: Crash guard
        run: make check

  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 / Xcode 26.6
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            primary: true
          - name: macOS 27 / Xcode 27.2
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
            primary: false
    env:
      XCODE_DEVELOPER_DIR: ${{ matrix.xcode }}
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
      - uses: actions/cache@v6
        with:
          path: dreamder/.build/xcode/SourcePackages
          key: spm-${{ matrix.runner }}-${{ matrix.xcode }}-${{ hashFiles('dreamder/Dreamder.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ matrix.runner }}-${{ matrix.xcode }}-
      - name: Build
        run: make build
      - name: Unit tests with coverage
        run: make coverage
      - name: Headless smoke
        run: make smoke
      - name: Upload smoke result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.runner }}
          path: dreamder/.build/smoke
          if-no-files-found: ignore
      - name: Coverage gate against the previous successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/coverage-report.py .build/coverage.xcresult --baseline .build/coverage-baseline.json --write-baseline
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --workflow "$GITHUB_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ] && gh run download "$previous" --repo "$GITHUB_REPOSITORY" -n "coverage-baseline-${{ matrix.runner }}" -D .build/previous-coverage; then
            python3 Scripts/coverage-report.py .build/coverage.xcresult --check --summary --baseline .build/previous-coverage/coverage-baseline.json
          else
            echo "No coverage baseline from a previous successful run on ${{ matrix.runner }}; reporting only"
            python3 Scripts/coverage-report.py .build/coverage.xcresult --summary
          fi
      - name: Upload coverage baseline
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline-${{ matrix.runner }}
          path: dreamder/.build/coverage-baseline.json
          if-no-files-found: error
      - name: Build Release app
        if: matrix.primary
        run: make release
      - name: Upload app
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder
          path: dreamder/.build/Dreamder.zip
          if-no-files-found: error
      - name: Upload dSYM
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder-dSYM
          path: dreamder/.build/Dreamder-dSYM.zip
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.runner }}
          path: dreamder/.build/logs
          if-no-files-found: ignore
      - name: Upload coverage result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.runner }}
          path: dreamder/.build/coverage.xcresult
          if-no-files-found: ignore
