name: Dreamder

on:
  push:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
      - .github/workflows/dreamder-platform.yml
  pull_request:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
      - .github/workflows/dreamder-platform.yml
  workflow_dispatch:

concurrency:
  group: dreamder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Crash guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - name: Crash guard
        run: make check

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 / Xcode 26.6
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
          - name: macOS 27 / Xcode 27.2
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
    uses: ./.github/workflows/dreamder-platform.yml
    with:
      runner: ${{ matrix.runner }}
      xcode: ${{ matrix.xcode }}

  release:
    name: Release app (macOS 26 / Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - uses: actions/cache@v6
        with:
          path: dreamder/.build/xcode/SourcePackages
          key: spm-v3-release-macos-26-${{ hashFiles('dreamder/Dreamder.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-v3-release-macos-26-
      - name: Build Release app
        run: make release
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder
          path: dreamder/.build/Dreamder.zip
          if-no-files-found: error
      - name: Upload dSYM
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder-dSYM
          path: dreamder/.build/Dreamder-dSYM.zip
          if-no-files-found: error
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-release
          path: dreamder/.build/logs
          if-no-files-found: ignore
