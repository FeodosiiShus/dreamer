name: Dreamder

on:
  push:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
  pull_request:
    paths:
      - dreamder/**
      - .github/workflows/dreamder.yml
  workflow_dispatch:

concurrency:
  group: dreamder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Crash guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - name: Crash guard
        run: make check

  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 / Xcode 26.6
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            primary: true
          - name: macOS 27 / Xcode 27.2
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
            primary: false
    env:
      XCODE_DEVELOPER_DIR: ${{ matrix.xcode }}
    defaults:
      run:
        working-directory: dreamder
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dreamder
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
      - uses: actions/cache@v6
        with:
          path: dreamder/.build/xcode/SourcePackages
          key: spm-${{ matrix.runner }}-${{ matrix.xcode }}-${{ hashFiles('dreamder/Dreamder.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ matrix.runner }}-${{ matrix.xcode }}-
      - name: Build
        run: make build
      - name: Unit tests with coverage
        env:
          COVERAGE_CHECK: ${{ matrix.primary && '1' || '0' }}
        run: make coverage
      - name: Build Release app
        if: matrix.primary
        run: make release
      - name: Upload app
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder
          path: dreamder/.build/Dreamder.zip
          if-no-files-found: error
      - name: Upload dSYM
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: Dreamder-dSYM
          path: dreamder/.build/Dreamder-dSYM.zip
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.runner }}
          path: dreamder/.build/logs
          if-no-files-found: ignore
      - name: Upload coverage result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.runner }}
          path: dreamder/.build/coverage.xcresult
          if-no-files-found: ignore
